name: Update Readme on WordPress.org

on:
  push:
    branches:
      - main
    paths:
      - 'trunk/readme.txt'

jobs:
  readme:
    name: Push readme to WordPress.org SVN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Update readme and assets on WordPress.org
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG:         avcl-subscription-interval-repair-for-woocommerce
          ASSETS_DIR:   assets
