name: Update Readme on WordPress.org

on:
  push:
    branches:
      - main        # change to "master" if that's your default branch
    paths:
      - 'trunk/readme.txt'   # only runs when readme.txt actually changes

jobs:
  readme:
    name: Push readme to WordPress.org SVN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update readme and assets on WordPress.org
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG:         avcl-subscription-interval-repair-for-woocommerce
          ASSETS_DIR:   assets
